<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrapbook — [Your Name]</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <span class="sidebar-title">[Your Name]<br>IB English · Hawaii</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="english/index.html">English</a>
      <a href="scrapbook.html" class="active">Scrapbook</a>
      <a href="placeholder.html">Notes</a>
    </nav>
  </aside>

  <main class="main scrapbook-main">
    <div class="scrapbook-col">

      <!-- Entry: image -->
      <div class="scrapbook-entry">
        <span class="entry-date">April 2026</span>
        <img src="images/placeholder.jpg" alt="[Image description]">
        <p class="caption">[A note about this image — what it is, why it's here, or just a line that felt right.]</p>
      </div>

      <!-- Entry: embedded video -->
      <div class="scrapbook-entry">
        <span class="entry-date">March 2026</span>
        <div class="video-wrap">
          <!-- Replace the src with your YouTube embed URL -->
          <iframe src="https://www.youtube.com/embed/VIDEO_ID"
                  frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
        </div>
        <p class="caption">[A note about this video.]</p>
      </div>

      <!-- Entry: image -->
      <div class="scrapbook-entry">
        <span class="entry-date">February 2026</span>
        <img src="images/placeholder2.jpg" alt="[Image description]">
        <p class="caption">[Caption.]</p>
      </div>

      <!-- Add new entries above this comment, newest first -->

    </div>
  </main>

</body>
</html>
